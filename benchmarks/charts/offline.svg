<svg xmlns="http://www.w3.org/2000/svg" width="900" height="394"
     viewBox="0 0 900 394" role="img"
     aria-label="Nimble classifier — routing accuracy and overhead">
  <rect width="900" height="394" fill="#131720"/>
  <text x="70" y="58" fill="#e6edf3" font-size="23" font-weight="700"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">Nimble classifier — routing accuracy and overhead</text>
  <text x="70" y="88" fill="#8b98a9" font-size="14">12 routing cases &nbsp;·&nbsp; all local, no API calls</text>
  <text x="70" y="112" fill="#8b98a9" font-size="12" font-family="ui-monospace, Consolas, monospace">
    generated 2026-09-30T13:37:07 — reproduce with benchmarks/run_benchmark.py
  </text>
  <line x1="70" y1="126" x2="830" y2="126" stroke="#232a36" stroke-width="1"/>

  <g>
    <text x="70" y="140" fill="#e6edf3" font-size="15" font-weight="600">Routing accuracy</text>
    <rect x="70" y="150" width="560" height="22" rx="5" fill="#232a36"/>
    <rect x="70" y="150" width="466" height="22" rx="5" fill="#6fc3e8"/>
    <text x="646" y="167" fill="#8b98a9" font-size="15"
          font-family="ui-monospace, Consolas, monospace">83.3%  (10/12)</text>
  </g>
  <g>
    <text x="70" y="198" fill="#e6edf3" font-size="15" font-weight="600">Published Nimble intent routing</text>
    <rect x="70" y="208" width="560" height="22" rx="5" fill="#232a36"/>
    <rect x="70" y="208" width="486" height="22" rx="5" fill="#8b98a9"/>
    <text x="646" y="225" fill="#8b98a9" font-size="15"
          font-family="ui-monospace, Consolas, monospace">86.9%  (MASSIVE-en-US)</text>
  </g>
  <g>
    <text x="70" y="256" fill="#e6edf3" font-size="15" font-weight="600">Overhead per message</text>
    <rect x="70" y="266" width="560" height="22" rx="5" fill="#232a36"/>
    <rect x="70" y="266" width="270" height="22" rx="5" fill="#e8a06f"/>
    <text x="646" y="283" fill="#8b98a9" font-size="15"
          font-family="ui-monospace, Consolas, monospace">724ms</text>
  </g>
</svg>
